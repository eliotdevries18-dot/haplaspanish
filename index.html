<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HablaSA | AI Tutor</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .chile-gradient { background: linear-gradient(135deg, #0039a6 0%, #d52b1e 100%); }
        .chat-bubble-ai { background: #f1f5f9; border-radius: 20px 20px 20px 4px; }
        .chat-bubble-user { background: #0039a6; color: white; border-radius: 20px 20px 4px 20px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [tab, setTab] = useState('chat');
            const [input, setInput] = useState('');
            const [messages, setMessages] = useState([
                { role: 'ai', text: "¡Hola! I'm Valentina. I know 'every word' in Chile. Type a word like 'Bacán' or ask me 'How do I say...?'" }
            ]);

            const speak = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-CL';
                window.speechSynthesis.speak(utterance);
            };

            const handleSend = () => {
                if (!input.trim()) return;
                const userMsg = input.toLowerCase();
                const newMessages = [...messages, { role: 'user', text: input }];
                setMessages(newMessages);
                setInput('');

                // --- SMART AI LOGIC ---
                setTimeout(() => {
                    let response = "I'm still learning that one! But try asking me about 'Cachai' or 'Food'.";
                    
                    if (userMsg.includes("cachai")) {
                        response = "¡Bacán! 'Cachai' is our way of saying 'You know?'. We use it at the end of almost every sentence. Example: 'Está nublado, ¿cachai?' (It's cloudy, you know?)";
                    } else if (userMsg.includes("food") || userMsg.includes("hambre")) {
                        response = "Hungry? In Chile, we love 'Completos' (hot dogs) and 'Empanadas'. To order, say: 'Quiero una empanada, por favor.'";
                    } else if (userMsg.includes("hola") || userMsg.includes("que tal")) {
                        response = "¡Hola! A real Chilean would say: '¿Cómo estai?' notice we use 'i' instead of 'as' at the end!";
                    } else if (userMsg.includes("que pedo")) {
                        response = "Haha, that's very Mexican! In Chile, if something is crazy or weird, we say '¡Qué onda!' or '¡Qué volá!'";
                    } else if (userMsg.includes("gracias")) {
                        response = "¡De nada! (You're welcome). You're getting better already!";
                    }

                    setMessages(prev => [...prev, { role: 'ai', text: response }]);
                    speak(response.split('.')[0]); // Speak the first sentence
                }, 800);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white flex flex-col shadow-2xl relative">
                    <header className="p-6 bg-white border-b flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <div className="w-10 h-10 chile-gradient rounded-xl flex items-center justify-center text-white font-black italic">V</div>
                            <div>
                                <h1 className="text-lg font-extrabold text-slate-800 leading-none">Valentina AI</h1>
                                <span className="text-[10px] text-green-500 font-bold uppercase tracking-widest">Online Now</span>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] p-4 shadow-sm text-sm ${m.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai text-slate-700'}`}>
                                    {m.text}
                                </div>
                            </div>
                        ))}
                    </main>

                    <div className="p-4 bg-white border-t sticky bottom-20">
                        <div className="flex space-x-2">
                            <input 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                placeholder="Ask Valentina anything..." 
                                className="flex-1 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 transition-all"
                            />
                            <button onClick={handleSend} className="bg-blue-600 text-white w-14 rounded-2xl flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                                <i className="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>

                    <nav className="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around items-center h-20 pb-4">
                        <button onClick={() => setTab('home')} className="text-slate-400 flex flex-col items-center">
                            <i className="fas fa-home text-xl"></i>
                            <span className="text-[10px] font-bold mt-1">HOME</span>
                        </button>
                        <button onClick={() => setTab('chat')} className="text-blue-600 flex flex-col items-center">
                            <i className="fas fa-robot text-xl"></i>
                            <span className="text-[10px] font-bold mt-1">AI TUTOR</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
